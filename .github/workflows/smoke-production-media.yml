name: Smoke production media
run-name: Smoke production media

on:
  workflow_dispatch:
    inputs:
      public_base_url:
        description: Optional HTTPS production URL. Defaults to PRODUCTION_PUBLIC_BASE_URL.
        required: false
        type: string
      start_second:
        description: Existing owned range start second.
        required: false
        default: "7000"
        type: string
      end_second:
        description: Existing owned range end second.
        required: false
        default: "7001"
        type: string

permissions:
  contents: read

concurrency:
  group: production-media-smoke
  cancel-in-progress: false

env:
  PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}

jobs:
  smoke:
    name: Media smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify production media
        shell: bash
        env:
          INPUT_PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
          INPUT_START_SECOND: ${{ inputs.start_second }}
          INPUT_END_SECOND: ${{ inputs.end_second }}
          PRODUCTION_MEDIA_OWNER_EMAIL: ${{ secrets.PRODUCTION_MEDIA_OWNER_EMAIL }}
          PRODUCTION_MEDIA_OWNER_PASSWORD: ${{ secrets.PRODUCTION_MEDIA_OWNER_PASSWORD }}
          PRODUCTION_ADMIN_EMAIL: ${{ secrets.PRODUCTION_ADMIN_EMAIL }}
          PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          base_url="${INPUT_PUBLIC_BASE_URL:-${PRODUCTION_PUBLIC_BASE_URL:-}}"
          start_second="${INPUT_START_SECOND:-7000}"
          end_second="${INPUT_END_SECOND:-7001}"

          ./scripts/verify-production-media-smoke.sh \
            --base-url "$base_url" \
            --start-second "$start_second" \
            --end-second "$end_second"

          {
            echo "## Production media smoke"
            echo
            echo "- Base URL: \`${base_url%/}\`"
            echo "- Owned range: \`[${start_second}, ${end_second})\`"
            echo "- Owned media upload: passed"
            echo "- Admin moderation list visibility: passed"
            echo "- Admin original preview download: passed"
            echo "- Admin approval: passed"
            echo "- Public timeline playback: passed"
          } >> "$GITHUB_STEP_SUMMARY"
